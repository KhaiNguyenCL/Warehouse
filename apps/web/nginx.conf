server {
    listen 80;
    server_name _;

    # Gzip để giảm bandwidth
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # React SPA — mọi route không khớp file tĩnh đều trả index.html
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets tĩnh có hash trong tên file (Vite build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API sang backend
    location /api/ {
        proxy_pass         http://backend:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy uploads (ảnh, file đính kèm) sang backend
    location /uploads/ {
        proxy_pass         http://backend:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_read_timeout 30s;
        # Cache uploads phía client 7 ngày
        add_header Cache-Control "public, max-age=604800";
    }
}
